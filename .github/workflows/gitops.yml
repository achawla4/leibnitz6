name: Leibnitz 6 GitOps & DevSecOps CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Run Security Audit (Bandit & Security Suite)
      env:
        PYTHONPATH: .
        MPLBACKEND: Agg
      run: |
        python -m pytest tests/test_security_stack.py
    - name: Run Full Test Suite
      env:
        PYTHONPATH: .
        MPLBACKEND: Agg
      run: |
        python -m pytest tests/

  gitops-deploy:
    needs: test-and-verify
    runs-on: ubuntu-latest
    steps:
    - name: Sync GitOps Kubernetes Manifests
      run: |
        echo "[GitOps] Kubernetes manifests (k8s/) verified for ArgoCD / Render auto-sync."
