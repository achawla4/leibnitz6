services:
  - type: web
    name: leibnitz6-cloud-engine
    env: python
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.11
      - key: GGUF_MODEL_PATH
        value: solar-10.7b-instruct-q4_k_m.gguf


