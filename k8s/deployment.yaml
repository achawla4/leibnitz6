apiVersion: apps/v1
kind: Deployment
metadata:
  name: leibnitz6-cloud-engine
  labels:
    app.kubernetes.io/name: leibnitz6
    app.kubernetes.io/component: cloud-engine
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0%
  selector:
    matchLabels:
      app: leibnitz6
  template:
    metadata:
      labels:
        app: leibnitz6
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        readOnlyRootFilesystem: false
      containers:
      - name: leibnitz6-engine
        image: ghcr.io/realinstitute/leibnitz6:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5006
          name: http
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "1000m"
            memory: "2Gi"
        livenessProbe:
          httpGet:
            path: /health
            port: 5006
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 5006
          initialDelaySeconds: 5
          periodSeconds: 5
        env:
        - name: PORT
          value: "5006"
        - name: PYTHON_VERSION
          value: "3.10.11"
---
apiVersion: v1
kind: Service
metadata:
  name: leibnitz6-service
spec:
  type: ClusterIP
  selector:
    app: leibnitz6
  ports:
  - port: 80
    targetPort: 5006
    name: http
